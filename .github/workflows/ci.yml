name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate + schema sync
        run: npm run db:push
        env:
          DATABASE_URL: file:${{ github.workspace }}/db/seed.db

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: AI client smoke (self-stubbed, no keys)
        run: bun scripts/ai-smoke.ts
      - name: Notify smoke (email + Slack contracts, no network)
        run: bun scripts/notify-smoke.ts

      - name: Playwright browsers
        run: npx playwright install --with-deps chromium

      # NEXTAUTH_SECRET / CRON_SECRET live in gitignored .env.local — generate
      # per-run so login + cron tests work without repo secrets. public/uploads
      # is also gitignored (F7): materialize whatever the committed DB references
      # from committed field-media so seeded assets don't 404 in the journey.
      - name: Generate CI-only env (secrets + seeded uploads)
        run: |
          {
            echo "NEXTAUTH_SECRET=$(openssl rand -hex 32)"
            echo "CRON_SECRET=$(openssl rand -hex 32)"
          } >> .env.local
          mkdir -p public/uploads
          python3 - <<'EOF'
          import os, shutil, sqlite3
          srcs = sorted(os.listdir("public/field-media"))
          con = sqlite3.connect("db/seed.db")
          rows = con.execute("SELECT url FROM MediaAsset WHERE url LIKE '/uploads/%'").fetchall()
          for (url,) in rows:
              name = os.path.basename(url.split("?")[0])
              dst = f"public/uploads/{name}"
              if name and not os.path.exists(dst) and srcs:
                  shutil.copy(f"public/field-media/{srcs[0]}", dst)
                  print(f"materialized {dst} (seeded asset referenced {url})")
          print(f"{len(rows)} DB-referenced upload(s)")
          EOF
          [ -n "$(ls -A public/uploads 2>/dev/null)" ] || echo "ci placeholder" > public/uploads/ci-placeholder.txt
          # build already copied public/ into standalone — mirror the seeded files there too
          mkdir -p .next/standalone/public/uploads
          cp public/uploads/* .next/standalone/public/uploads/

      - name: Start production server
        run: |
          set -a; source .env; source .env.local; set +a
          DATABASE_URL="file:$(pwd)/db/seed.db" NODE_ENV=production PORT=3002 \
            nohup bun .next/standalone/server.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:3002/auth && exit 0
            sleep 1
          done
          echo "server never became healthy"; cat server.log; exit 1

      - name: E2E suite
        run: npm run test:e2e

      - name: Server log on failure
        if: failure()
        run: cat server.log || true
