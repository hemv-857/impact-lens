name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate + schema sync
        run: npm run db:push
        env:
          DATABASE_URL: file:${{ github.workspace }}/db/custom.db

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: AI client smoke (self-stubbed, no keys)
        run: bun scripts/ai-smoke.ts

      - name: Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start production server
        run: |
          set -a; source .env; set +a
          DATABASE_URL="file:$(pwd)/db/custom.db" NODE_ENV=production PORT=3001 \
            nohup bun .next/standalone/server.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3001/auth && exit 0
            sleep 1
          done
          echo "server never became healthy"; cat server.log; exit 1

      - name: E2E suite
        run: npm run test:e2e

      - name: Server log on failure
        if: failure()
        run: cat server.log || true
